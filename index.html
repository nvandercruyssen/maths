<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mathématiques – Cours</title>
<style>
:root {
  --fond: #f3f5fa;
  --carte: #ffffff;
  --texte: #1f2937;
  --discret: #6b7280;
  --bord: #e5e7eb;
  --c1: #2563eb;
  --c2: #7c3aed;
  --c3: #0d9488;
  --c4: #d97706;
}
@media (prefers-color-scheme: dark) {
  :root {
    --fond: #111827;
    --carte: #1f2937;
    --texte: #f3f4f6;
    --discret: #9ca3af;
    --bord: #374151;
    --c1: #60a5fa;
    --c2: #a78bfa;
    --c3: #2dd4bf;
    --c4: #fbbf24;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 0 16px 48px;
  background: var(--fond);
  color: var(--texte);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  line-height: 1.5;
}
h1 {
  margin: 0 -16px 32px;
  padding: 40px 16px 36px;
  text-align: center;
  font-size: clamp(1.7rem, 5vw, 2.4rem);
  color: #fff;
  background: linear-gradient(135deg, #1e3a8a, #4f46e5);
}
h1::after {
  content: "∑ π √ ∞ ∫";
  display: block;
  margin-top: 6px;
  font-size: 1rem;
  font-weight: 400;
  letter-spacing: .6em;
  opacity: .6;
}
h2, ol { max-width: 760px; margin-left: auto; margin-right: auto; }
h2 {
  --c: var(--c1);
  margin-top: 36px;
  margin-bottom: 12px;
  padding-left: 12px;
  border-left: 5px solid var(--c);
  font-size: 1.3rem;
}
h2:nth-of-type(2) { --c: var(--c2); }
h2:nth-of-type(3) { --c: var(--c3); }
h2:nth-of-type(4) { --c: var(--c4); }
ol {
  --c: var(--c1);
  list-style: none;
  counter-reset: chap;
  padding: 0;
  background: var(--carte);
  border: 1px solid var(--bord);
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 1px 3px rgba(0,0,0,.06);
}
ol:nth-of-type(2) { --c: var(--c2); }
ol:nth-of-type(3) { --c: var(--c3); }
ol:nth-of-type(4) { --c: var(--c4); }
li { counter-increment: chap; border-top: 1px solid var(--bord); }
li:first-child { border-top: none; }
li a {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 14px 16px;
  color: inherit;
  text-decoration: none;
  transition: background .15s;
}
li a::before {
  content: counter(chap);
  flex: none;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-weight: 700;
  font-size: .9rem;
  color: #fff;
  background: var(--c);
}
li a::after {
  content: "PDF";
  margin-left: auto;
  padding: 2px 8px;
  border-radius: 6px;
  font-size: .75rem;
  font-weight: 600;
  color: var(--c);
  border: 1px solid var(--c);
}
li a:hover, li a:focus-visible { background: color-mix(in srgb, var(--c) 10%, transparent); }
</style>
</head>
<body>
<h1>Cours de mathématiques</h1>

<h2>Seconde</h2>

</ol>

</ol>

</ol>
</body>
</html>
